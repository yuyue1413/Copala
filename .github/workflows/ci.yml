name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "true"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests evaluation
      - name: Tests and branch coverage
        run: python -m pytest -q --cov=copala --cov-branch --cov-report=term-missing
      - name: Routing regression
        run: python -m evaluation.run --suite routing --output routing-check.json
      - name: CLI module smoke test
        run: python -m copala --help

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check distribution contents
        run: |
          tar -tf dist/*.tar.gz
          python -m zipfile -l $(find dist -name '*.whl' -print -quit)
      - name: Install wheel and smoke test
        run: |
          python -m venv smoke-env
          smoke-env/bin/python -m pip install dist/*.whl
          smoke-env/bin/copala --help
          smoke-env/bin/python -m copala --help
